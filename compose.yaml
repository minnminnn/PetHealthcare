services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - petcare_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  petcare_db:
